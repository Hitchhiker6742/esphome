esphome:
  name: floor-heating
  friendly_name: Floor Heating

external_components:
  - source:
      type: local
      path: custom

esp32:
  board: esp32dev
  framework:
    type: arduino    

# Enable logging
logger:
  level: DEBUG #makes uart stream available in esphome logstream
  baud_rate: 0 #disable logging over uart

# Enable Home Assistant API
api:
  encryption:
    key: "dYV2JhTMkSGQP6w0hvIgZHiA3pKz+IUd0TXT55WJ+Jw="

ota:
  - platform: esphome
    password: "63aea147fde87c978ac0823e9e3c28ce"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Floor-Heating Fallback Hotspot"
    password: "PrhK5QtiiUA5"

captive_portal:
       
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200
  debug:
    direction: TX
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

