uponor_smatrix145:         
#  known addresses:
#  0x1204 0x2CCC - I-143 Schaltuhr
#  0x1104 0x497D - I-149 Thermonstat digital -> Wohnzimmer
#  0x110E 0xB075 - I-149 Thermonstat digital -> Schlafzimmer
#  0x110E 0xB09E - I-149 Thermonstat digital -> Bad
#  0x1004 0x45F1 - I-144 Thermonstat analog -> Küche
#  0x1004 0x45E8 - I-144 Thermonstat analog -> Computerzimmer
#  0x1004 0x45EF - I-144 Thermonstat analog -> Flur
#system address (only for correct run source code)
  address: 0x1204 
# set time to I-143 not working now
#  time_id: homeassistant_time
#  time_device_address: 0x2CCC

text_sensor:
  - platform: uponor_smatrix145
    system_address: 0x1204
    address: 0x2CCC
    type: I-143 
    timer_datetime:
      name: Timer Datetime
    timer_heating_mode:
      name: Timer Heating Mode
    timer_vacation_mode:
      name: Timer Vacation Mode
    timer_calibration_mode:
      name: Timer calibration Mode

